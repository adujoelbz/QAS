server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  profiles:
    default: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-none}]"
