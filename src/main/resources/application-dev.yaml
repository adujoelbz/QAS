spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:418250112}
jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: ${CLOUDINARY_SECURE:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  notification:
    email-from: ${MAIL_FROM:noreply@queueless.com}
    base-url: ${APP_BASE_URL:http://localhost:8080}

sendgrid:
  enabled: ${SENDGRID_ENABLED:false}
  api-key: ${SENDGRID_API_KEY:}
  api-url: ${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
  timeout: ${SENDGRID_TIMEOUT:10000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:5000}
    timeout: ${AI_TIMEOUT:5000}
    enabled: ${AI_ENABLED:false}
