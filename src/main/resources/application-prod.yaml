spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: ${CLOUDINARY_SECURE:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  notification:
    email-from: ${MAIL_FROM:noreply@queueless.com}
    base-url: ${APP_BASE_URL}

sendgrid:
  enabled: ${SENDGRID_ENABLED:true}
  api-key: ${SENDGRID_API_KEY}
  api-url: ${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
  timeout: ${SENDGRID_TIMEOUT:10000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:5000}
    timeout: ${AI_TIMEOUT:5000}
    enabled: ${AI_ENABLED:false}
